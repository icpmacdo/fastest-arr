<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fastest ARR og image</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  /* Mirrors the in-game share image (drawCard in index.html), with an invitation instead of a result. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f3eee4; }
  body { position: relative; color: #1c1b18; font-family: "Newsreader", Georgia, serif; text-align: center; }
  .outer, .inner { position: absolute; border: 1px solid #1c1b18; }
  .outer { inset: 36px; border-width: 1.5px; }
  .inner { inset: 46px; }
  .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .record { font-size: 22px; font-style: italic; color: #4f4b44; }
  .co { margin-top: 30px; font-size: 46px; font-weight: 500; line-height: 1.1; }
  .small { margin-top: 10px; font-size: 24px; font-style: italic; color: #4f4b44; }
  .fig { margin: 8px 0 4px; font-size: 118px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; }
  .rule { width: 48px; height: 1px; margin: 30px 0 22px; background: #1c1b18; }
  .brand { font-family: "Inter", sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 3px; color: #1d6a44; }
  .line { margin-top: 12px; font-size: 21px; color: #4f4b44; }
</style>
</head>
<body>
  <div class="outer"></div>
  <div class="inner"></div>
  <div class="stack">
    <div class="record">This announcement appears as a matter of record only.</div>
    <div class="co">Your Startup</div>
    <div class="small">has reached</div>
    <div class="fig">$45,298,576</div>
    <div class="small" style="margin-top:0">in annual recurring revenue</div>
    <div class="rule"></div>
    <div class="brand">FASTEST ARR</div>
    <div class="line">Incorporate, then collect your first payment. We annualize it.</div>
  </div>
</body>
</html>
