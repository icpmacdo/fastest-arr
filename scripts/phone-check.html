<!doctype html>
<meta charset="utf-8">
<title>Fastest ARR phone check</title>
<!-- Dev harness: five 390px phones (idle, mid-round, result, dissolved, leaderboard). Serve the repo root over http and open /scripts/phone-check.html[?api=http://127.0.0.1:8799].
     It seeds a sample leaderboard into this origin's localStorage (overwriting it), so don't use it on an origin whose scores you care about. -->
<script>
  localStorage.setItem('fastest-arr:board', JSON.stringify([
    { id: 'a', co: 'Cursor for Cats', arr: 62.4e6, ms: 250, at: 0 },
    { id: 'b', co: 'Stripe for Lemonade Stands', arr: 25.7e6, ms: 400, at: 0 },
    { id: 'c', co: 'Uber for Ferns', arr: 15.6e6, ms: 500, at: 0 },
    { id: 'd', co: 'GPT Wrapper #4,812', arr: 1.95e6, ms: 1000, at: 0 },
  ]));
</script>
<style>
  body { margin: 0; display: flex; gap: 6px; background: #888; }
  iframe { width: 390px; height: 844px; border: 0; background: #fff; }
</style>
<body>
<script>
  // ?api=http://127.0.0.1:8799 passes through to the game, so the result phone submits to a local `wrangler dev`
  const api = new URLSearchParams(location.search).get('api');
  const src = '../index.html?dev' + (api ? '&api=' + encodeURIComponent(api) : '');
  for (const id of ['idle', 'live', 'result', 'dissolved', 'board']) {
    const f = document.createElement('iframe');
    f.id = id;
    f.src = src;
    document.body.append(f);
  }
  addEventListener('load', () => {
    const w = id => document.getElementById(id).contentWindow;
    w('live').fastestArr.start();
    w('result').fastestArr.finish(300);
    w('dissolved').fastestArr.finish(5000);
    w('board').document.getElementById('boardBtn').click();
  });
</script>
