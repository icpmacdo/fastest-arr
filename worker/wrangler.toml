name = "fastest-arr-api"
main = "src/index.js"
compatibility_date = "2026-09-15"

# One global leaderboard, stored in a SQLite-backed Durable Object.
# (D1 would also work, but the account is at the free plan's 10-database cap.)
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

[observability]
enabled = true
